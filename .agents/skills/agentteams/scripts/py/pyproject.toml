[project]
name = "agentteams"
version = "0.1.0"
description = "AgentTeams orchestrator — plan analyzer, dependency DAG, token-budget slicer, HITL iteration loop."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentteams = "agentteams.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentteams"]

[tool.pytest.ini_options]
testpaths = ["tests"]
